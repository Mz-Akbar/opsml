name: CI/CD to AWS EKS on Tag Push

on:
  push:
    branches:
      - dev1
    tags:
      - 'v*'  

# env:
#   AWS_ACCESS_KEY_ID: {{ secrets.AWS_ACCESS_KEY_ID }}
#   AWS_SECRET_ACCESS_KEY: {{ secrets.AWS_SECRET_ACCESS_KEY }}
#   AWS_SESSION_TOKEN: {{ secrets.AWS_SESSION_TOKEN }}
#   AWS_REGION: {{ secrets.IDAWS_REGION }}
#   ECR_REGISTRY: {{ secrets.ECR_REGISTRY }}
#   ECR_REPOSITORY: {{ secrets.ECR_REPOSITORY }}
#   CLUSTER_NAME: {{ secrets.CLUSTER_NAME }}


jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${GITHUB_REF_NAME}"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Replace Image
        run: |
          sed -i "s"|<app-image>|$IMAGE|g" deploy.yaml
          cat deploy.yaml

  setup:
    name: Configure kubeconfig for EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Environment substituted
        env:
          AWS_ACCESS_KEY_ID: {{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: {{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: {{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: {{ secrets.IDAWS_REGION }}
          S3_STAGING_DIR: {{ secrets.S3_STAGING_DIR }}
          FLASK_SECRET_KEY: {{ secrets.FLASK_SECRET_KEY }}
          API_GATEWAY_URL: {{ secrets.API_GATEWAY_URL }}
          SNS_TOPIC_ARN: {{ secrets.SNS_TOPIC_ARN }}
          ATHENA_SCHEMA_NAME: {{ secrets.ATHENA_SCHEMA_NAME }}

      - name: Replace env
        run: |
          envsubst < deploy-subs.yaml > deploy.yaml
          cat deploy.yaml

      - name: Delete old Kubernetes resources
        run: |
          kubectl delete -f deploy.yaml || true
          kubectl delete -f service.yaml || true

      - name: Deploy new version to EKS
        run: |
          kubectl apply -f deploy.yaml 
          kubectl apply -f service.yaml 