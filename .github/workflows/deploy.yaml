name: CI/CD AWS to EKS on Tag Push

on:
  push:
    tags: v1.1.1
    branches:
      - dev

jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${GITHUB_REF_NAME}"
          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Build 
        id: build-image
        run: |
          sed -i "s|<image-app>|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" deployment/deploy.yaml
          cat deployment/deploy.yaml

      # - name: Replace Credentials
      #   run: |
      #     sed -i "s|<AWS_ACCESS_KEY_ID>|$AWS_ACCESS_KEY_ID|g" deployment/deploy.yaml
      #     sed -i "s|<AWS_SECRET_ACCESS_KEY>|$AWS_SECRET_ACCESS_KEY|g" deployment/deploy.yaml
      #     sed -i "s|<AWS_SESSION_TOKEN>|$AWS_SESSION_TOKEN|g" deployment/deploy.yaml
      #     sed -i "s|<AWS_REGION>|$AWS_REGION|g" deployment/deploy.yaml
      #     echo "Cofiguration updated."
      #     cat deployment/deploy.yaml




  setup:
    name: Configure kubeconfig for EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Substitute environment variables in deploy.yaml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          S3_STAGING_DIR: ${{ secrets.S3_STAGING_DIR }}
          ATHENA_SCHEMA_NAME: ${{ secrets.ATHENA_SCHEMA_NAME }}
          ATHENA_DB: ${{ secrets.ATHENA_DB }}


        run: |
          envsubst < deployment/deploy.yaml > deployment/deploy.substituted.yaml
          cat deployment/deploy.substituted.yaml


      - name: Delete old Kubernetes resources
        run: |
          kubectl delete -f deployment/deploy.yaml || true
          kubectl delete -f deployment/service.yaml || true

      - name: Deploy new version to EKS
        run: |
          kubectl apply -f deployment/deploy.yaml
          kubectl apply -f deployment/service.yaml
